<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <h1>Canvas Grades</h1>
        <span class="muted" id="summary-line"></span>
    </header>
    <div id="status">Open a Canvas course grades page to capture it.</div>
    <div id="grade-link-container" style="display:none; margin-bottom:10px;">
        <a id="grade-link" href="#" target="_blank" rel="noopener noreferrer">Open the correct Grades page</a>
    </div>
    <div class="row">
        <button id="parse-btn" class="primary grow">Capture this page</button>
    </div>
    <div id="courses"></div>
    <div class="row" id="export-controls">
        <button id="download-raw" class="grow" title="Latest raw page HTML + parsed data + estimate per course, for review by an agent">Export raw for review</button>
        <button id="download-json">JSON</button>
        <button id="download-csv">CSV</button>
        <button id="clear-all" class="danger">Clear</button>
    </div>
    <script src="grading.js"></script>
    <script src="common.js"></script>
    <script src="popup.js"></script>
</body>
</html>
